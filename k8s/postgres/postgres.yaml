apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Bitnami images run as user 1001 by default.
      # We use fsGroup to try and align permissions, but the initContainer is the real fix.
      securityContext:
        fsGroup: 1001
      initContainers:
      - name: fix-permissions
        image: busybox
        # We simply open the gate. We make the mount writable by "others".
        # Since Bitnami skips the chown check, this write access is all it needs.
        command: ["sh", "-c", "chmod 777 /bitnami/postgresql"]
        volumeMounts:
        - name: postgres-storage
          mountPath: /bitnami/postgresql
      containers:
      - name: postgres
        # CHANGE: Use Bitnami image (handles NFS permissions gracefully)
        image: bitnamilegacy/postgresql:15
        ports:
        - containerPort: 5432
        env:
        # CHANGE: Bitnami uses different variable names
        - name: POSTGRESQL_USERNAME
          value: postgres
        - name: POSTGRESQL_PASSWORD
          value: Password
        - name: POSTGRESQL_DATABASE
          value: my_database
        volumeMounts:
        - name: postgres-storage
          mountPath: /bitnami/postgresql
      # (Optional) If you have image pull secrets for Docker Hub, keep them. 
      # Bitnami is public, so you might not need the secret unless you mirror it.
      # imagePullSecrets:
      # - name: gar-pull-secret
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi