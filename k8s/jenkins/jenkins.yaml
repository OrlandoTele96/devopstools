apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      securityContext:
        fsGroup: 1000  # Important for volume permissions
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: jenkins
        env:
        - name: JENKINS_OPTS
          value: "--prefix=/jenkins"
        image: us-central1-docker.pkg.dev/jorgegonzalezdev-site/devops/jenkins-infra-builder-master:v2.1.0
        securityContext:
          runAsUser: 1000  # Jenkins user in official image
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        ports:
          - name: http-port
            containerPort: 8080
          - name: jnlp-port
            containerPort: 50000
        volumeMounts:
          - name: jenkins-vol
            mountPath: /var/jenkins_home
      volumes:
        - name: jenkins-vol
          persistentVolumeClaim:
            claimName: jenkins-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: devops
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: jenkins
  type: NodePort
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-pvc
  namespace: devops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: jenkins-http-route
  namespace: devops
spec:
  ingressClassName: apisix
  http:
  - name: jenkins-main
    match:
      hosts:
      - www.jorge-gonzalez.info
      paths:
      - /jenkins*    # Note the asterisk to catch all subpaths
      - /jenkins/    # Optional: catches with trailing slash
    backends:
    - serviceName: jenkins
      servicePort: 8080
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        uri: "/"     # Rewrites the incoming /jenkins path to /
        headers:
          X-Forwarded-Proto: "http"
          X-Forwarded-Prefix: "/jenkins"
    - name: cors
      enable: true
      config:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
        allow_headers: "*"
        expose_headers: "*"
        max_age: 3600